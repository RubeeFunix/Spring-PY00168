<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>User Page</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $(document).ready(() => {
            const avatarFile = $("#avatarFile");
            avatarFile.change(function (e) {
    const file = e.target.files[0];
    if (file && (file.type === "image/png" || file.type === "image/jpeg" || file.type === "image/jpg")) {
        const imgURL = URL.createObjectURL(file);
        $("#avatarPreview").attr("src", imgURL).css({ "display": "block" });
    } else {
        alert("Vui lòng chọn file ảnh có định dạng .png, .jpg, hoặc .jpeg!");
        $("#avatarPreview").css({ "display": "none" }).attr("src", "");
    }
});
        });
    </script>

    
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage User</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/user">Users</a></li>
                        <li class="breadcrumb-item active">Create</li>
                    </ol>
                        <hr>
                        <div class="container mt-5">
                            <div class="row">
                                <div class="col-md-6 col-12 mx-auto">
                                    <h3>Create a user</h3>
                                    <hr>
                                    <form th:action="@{/admin/user/create}" th:object="${user}" method="POST" class="row" enctype="multipart/form-data">
                                        <!-- Email -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="email" class="form-label required-label">Email<span>*</span> </label>
                                            <input type="email" id="email" class="form-control" th:field="*{email}"
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback" th:errors="*{email}"></div>
                                            <div th:if="${error}" class="alert alert-danger">
                                                <strong>Lỗi:</strong> <span th:text="${error}"></span>
                                            </div>
                                            
                                        </div>

                                        <!-- Mật khẩu -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="matKhau" class="form-label required-label">Mật khẩu<span>*</span></label>
                                            <input type="password" id="matKhau" class="form-control" th:field="*{matKhau}"
                                                th:classappend="${#fields.hasErrors('matKhau')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('matKhau')}" class="invalid-feedback" th:errors="*{matKhau}"></div>
                                        </div>
                                        
                                        <!-- Số điện thoại -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="soDienThoai" class="form-label required-label">Số điện thoại<span>*</span></label>
                                            <input type="text" id="soDienThoai" class="form-control" th:field="*{soDienThoai}"
                                                th:classappend="${#fields.hasErrors('soDienThoai')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('soDienThoai')}" class="invalid-feedback" th:errors="*{soDienThoai}"></div>
                                            <div th:if="${errorSDT}" class="alert alert-danger">
                                                <strong>Lỗi:</strong> <span th:text="${errorSDT}"></span>
                                            </div>
                                        </div>
                                        
                                        <!-- Họ và tên -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="hoVaTen" class="form-label required-label">Họ và tên<span>*</span></label>
                                            <input type="text" id="hoVaTen" class="form-control" th:field="*{hoVaTen}"
                                                th:classappend="${#fields.hasErrors('hoVaTen')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('hoVaTen')}" class="invalid-feedback" th:errors="*{hoVaTen}"></div>
                                        </div>
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="diaChi" class="form-label">Address</label>
                                            <input type="text" id="diaChi" class="form-control" th:field="*{diaChi}">
                                        </div>
                                        <!-- User Role -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label class="form-label required-label">User Role:<span>*</span></label><br>
                                            <div th:each="role : ${userRoles}" class="form-check-inline">
                                                <input type="radio" th:field="*{userRole}" th:value="${role}" 
                                                    class="form-check-input" th:id="'userRole_' + ${role}">
                                                <label th:for="'userRole_' + ${role}" th:text="${role}" class="form-check-label"></label>
                                            </div>
                                            <div th:if="${#fields.hasErrors('userRole')}" class="text-danger small" th:errors="*{userRole}"></div>
                                        </div>

                                        
                                        
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="gioiTinh" class="form-label">Gender: </label><br>
                                            <!-- <div th:each="gender : ${gioiTinhs}" class="form-check-inline">
                                                <input type="radio" th:field="*{gioiTinh}" th:value="${gender}" 
                                                        class="form-check-input" id="gioiTinh" checked>
                                                <label class="form-check-label" th:text="${gender}" for="gioiTinh"></label>
                                            </div> -->
                                            <select th:field="*{gioiTinh}" class="col-12 form-select">
                                                <option th:each="option :${options}"
                                                th:value="${option}" th:text="${option}"></option>
                                            </select>
                                        </div>

                                        <!-- Ngày sinh -->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="ngaySinh" class="form-label required-label">Ngày sinh<span>*</span></label>
                                            <input type="date" id="ngaySinh" class="form-control" th:field="*{ngaySinh}"
                                                th:classappend="${#fields.hasErrors('ngaySinh')} ? 'is-invalid' : ''" required>
                                            <div th:if="${#fields.hasErrors('ngaySinh')}" class="invalid-feedback" th:errors="*{ngaySinh}"></div>
                                        </div>
                                        
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="ngayTaoAcc" class="form-label">Ngày Tạo Tài Khoản</label>
                                            <input type="date" id="ngayTaoAcc" class="form-control" th:field="*{ngayTaoAcc}">
                                        </div>
                                        
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="avatarFile" class="form-label">Upload File Avatar</label><br>
                                            <input type="file" class="form-control-file" id="avatarFile" name="image"
                                                accept=".png, .jpg, .jpeg">
                                        </div>
                                        <div class="col-12 mb-3">
                                            <img alt="avatarPreview" style="max-height: 250px; display: none;" id="avatarPreview">
                                        </div>                      
                                                
                                        <div class="col-12 mb-5">
                                            <button type="submit" class="btn btn-primary mt-3">Create</button>
                                            <a href="/admin/user" type="button" class="btn btn-success mt-3">
                                                Back
                                            </a>
                                        </div>
                                        <style>
                                            .error {
                                                color: red;
                                            }
                                        </style>
                                        
                                      </form>
                                </div>
                            </div>
                            
                        </div>
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
      <script>
    (function () {
      'use strict'
    
      var forms = document.querySelectorAll('.needs-validation')
    
      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
    
            form.classList.add('was-validated')
          }, false)
        })
    })()
    </script>
    
</body>
</html>
