<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Category Page</title>
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Category</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item active">Categories</li>
                    </ol>
                        <hr>
                        <div class="container mt-5">
                            <div class="row">
                                <div class="col-md-6 col-12 mx-auto">
                                    <h3>Update Category <span th:text="${category.categoryId}"></span> </h3>
                                    <hr>
                                <form th:action="@{/admin/category/update}" th:object="${category}" method="POST">
                                        <div class="mb-3">
                                          <label for="categoryId" class="form-label">Id: <span th:text="${category.categoryId}"></span></label>
                                          <input type="text" id="categoryId" class="form-control" th:field="*{categoryId}" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label for="categoryName" class="form-label"></label>
                                            <input type="text" id="categoryName" class="form-control" th:field="*{categoryName}">
                                        </div>
                                        <button type="submit" class="btn btn-warning mt-3">Update</button>
                                        <a href="/admin/category" type="button" class="btn btn-success mt-3">
                                            Back
                                        </a>
                                      </form>
                                </div>
                            </div>
                            
                        </div>
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
      
    
</body>
</html>
