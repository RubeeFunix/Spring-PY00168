<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Supplier Page</title>
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage supplier</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item active">Suppliers</li>
                    </ol>
                        <div class="d-flex">
                            <div class="p2 me-auto">
                                <h2>Table Suppliers</h2>
                            </div>
                            <a href="/admin/supplier/create" type="button" class="btn btn-primary ml-auto">
                                Create a supplier
                            </a>
                        </div>
                        <hr>
                        <div class="col-lg-12 col-md-6">
                            <table class="table table-bordered table-hover">
                                <thead>
                                  <tr>
                                    <th scope="col">Supplier Id</th>
                                    <th scope="col">Supplier Address</th>
                                    <th scope="col">Supplier Email</th>
                                    <th scope="col">Supplier Tax Code</th>
                                    <th scope="col">Supplier Name</th>
                                  </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="supplier: ${suppliers}">
                                        <th scope="row" th:text="${supplier.supplierId}">1</th>
                                        <td><span th:text="${supplier.diaChiSup}">Supplier Address</span></td>
                                        <td><span th:text="${supplier.emailSup}">Supplier Email</span></td>
                                        <td><span th:text="${supplier.taxCode}">Supplier Tax Code</span></td>
                                        <td><span th:text="${supplier.tenSup}">Supplier Name</span></td>
                                        <td>
                                            <div class="d-flex">
                                                <a th:href="@{/admin/supplier/{supplierId}(supplierId = ${supplier.supplierId})}" type="button" class="btn btn-success">View</a>
                                            <a th:href="@{/admin/supplier/update/{supplierId}(supplierId = ${supplier.supplierId})}" type="button" class="btn btn-warning">Update</a>
                                            <a th:href="@{/admin/supplier/delete/{supplierId}(supplierId = ${supplier.supplierId})}" type="button" class="btn btn-danger">Delete</a>
                                            </div>
                                        </td>
                                    </tr>
                                  </tr>
                                </tbody>
                              </table>
                        
                        </div>
                        
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
      
    
</body>
</html>
