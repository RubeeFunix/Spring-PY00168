<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Product Page</title>
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(document).ready(() => {
    const avatarFile = $("#avatarFile");
    const avatarPreview = $("#avatarPreview");

    // Lấy đường dẫn ảnh gốc từ thuộc tính src của img
    const orgImage = avatarPreview.attr("src");

    // Nếu không có ảnh gốc hoặc nó là "null" hoặc rỗng thì ẩn ảnh
    if (!orgImage || orgImage.includes("null") || orgImage.trim() === "") {
        avatarPreview.hide();
    } else {
        avatarPreview.show();
    }

    // Khi chọn file mới
    avatarFile.change(function (e) {
        const file = e.target.files[0];

        if (file && (file.type === "image/png" || file.type === "image/jpeg" || file.type === "image/jpg")) {
            const imgURL = URL.createObjectURL(file);
            avatarPreview.attr("src", imgURL).show(); // Hiển thị ảnh mới
        } else {
            alert("Vui lòng chọn file ảnh có định dạng .png, .jpg, hoặc .jpeg!");
            avatarPreview.attr("src", orgImage).toggle(orgImage && orgImage.trim() !== ""); // Quay lại ảnh cũ nếu có, nếu không thì ẩn
        }
    });
});


</script>
    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Product</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/product">Products</a></li>
                        <li class="breadcrumb-item active">Update</li>
                    </ol>
                        <hr>
                        <div class="container mt-5">
                            <div class="row">
                                <div class="col-md-6 col-12 mx-auto">
                                    <h3>Update Products <span th:text="${product.productId}"></span> </h3>
                                    <hr>
                                <form th:action="@{/admin/product/update}" th:object="${product}" method="POST" enctype="multipart/form-data">
                                        <div class="mb-3" style="display: none;">
                                          <label for="productId" class="form-label">Id: <span th:text="${product.productId}"></span></label>
                                          <input type="text" id="productId" class="form-control" th:field="*{productId}" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label for="tenSP" class="form-label">Name Product:</label>
                                            <input type="text" id="tenSP" class="form-control" th:field="*{tenSP}">
                                            <!-- <div th:if="${error}" class="alert alert-danger">
                                                <strong>Lỗi:</strong> <span th:text="${error}"></span>
                                            </div> -->
                                        </div>
                                        <div class="mb-3">
                                          <label for="gia" class="form-label">Giá:</label>
                                          <input type="text" id="gia" class="form-control" th:field="*{gia}">
                                        </div>
                                        <div class="mb-3">
                                            <label for="moTaSP" class="form-label">Detail Product:</label>
                                            <input type="text" id="moTaSP" class="form-control" th:field="*{moTaSP}">
                                        </div>
                                        <div class="mb-3">
                                            <label for="moTaNganSP" class="form-label">Short Detail Product:</label>
                                            <input type="text" id="moTaNganSP" class="form-control" th:field="*{moTaNganSP}">
                                        </div>
                                        <div class="mb-3">
                                            <label for="sku" class="form-label">SKU:</label>
                                            <input type="text" id="sku" class="form-control" th:field="*{sku}" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label for="slTonKho" class="form-label">Sl_Ton Kho:</label>
                                            <input type="text" id="slTonKho" class="form-control" th:field="*{slTonKho}">
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="category" class="form-label">Category:</label><br>
                                            <select th:field="*{category.categoryId}" class="col-12 form-select">
                                                <option th:each="category :${categories}"
                                                th:value="${category.categoryId}" th:text="${category.categoryName}" th:selected="*{category.categoryId}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="tenSup" class="form-label">Supplier:</label><br>
                                            <select th:field="*{supplier.supplierId}" class="col-12 form-select">
                                                <option th:each="supplier :${suppliers}"
                                                th:value="${supplier.supplierId}" th:text="${supplier.tenSup}" th:selected="*{supplier.supplierId}"></option>
                                            </select>
                                        </div>
                                       

                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="avatarFile" class="form-label">Image</label><br>
                                            <input type="file" class="form-control-file" id="avatarFile" name="image"
                                                accept=".png, .jpg, .jpeg" >
                                        </div>
                                        <div class="col-12 mb-3" th:if="${product.imageURL != null and product.imageURL != ''}">
                                            <img alt="User Avatar" th:src="@{|/images/product/${product.imageURL}|}" style="max-height: 250px;" id="avatarPreview">
                                        </div>                                          
                                        <button type="submit" class="btn btn-warning mt-3">Update</button>
                                        <a href="/admin/product" type="button" class="btn btn-success mt-3">
                                            Back
                                        </a>
                                      </form>
                                </div>
                            </div>
                            
                        </div>
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
      
    
</body>
</html>
