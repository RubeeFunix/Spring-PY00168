<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Product Page</title>
    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Product</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/product">Products</a></li>
                        <li class="breadcrumb-item active">Detail</li>
                    </ol>
                        <hr>
                        <div class="container mt-5">
                            <div class="d-flex">
                                <div class="p2 me-auto">
                                    <h2>Product <span th:text="${product.productId}"></span> Details</h2>
                                </div>
                            </div>
                            <hr>
                            <div class="card" style="width: 60%;">
                                <div class="card-header">
                                Product Infomation
                                </div>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item">
                                        <img th:if="${product.imageURL != null and product.imageURL != ''}" th:src="@{|/images/product/${product.imageURL}|}" alt="Product Images" class="card-img-top">
                                        <span th:if="${product.imageURL == null or product.imageURL == ''}" class="text-danger">Không có ảnh</span>
                                    </li>
                                    
                                <li class="list-group-item">Tên sản phẩm: <span th:text="${product.tenSP}"></span></li>
                                <li class="list-group-item">Giá: <span th:text="${product.gia}"></span></li>
                                <li class="list-group-item">Số lượng tồn kho: <span th:text="${product.slTonKho}"></span></li>
                                <li class="list-group-item">SKU: <span th:text="${product.sku}"></span></li>
                                <li class="list-group-item">Danh mục: <span th:text="${product.category.categoryName}"></span></li>
                                <li class="list-group-item">Nhà cung cấp: <span th:text="${product.supplier.tenSup}"></span></li>
                                <li class="list-group-item">Mô tả ngắn sản phẩm: <span th:text="${product.moTaNganSP}"></span></li>
                                <li class="list-group-item">Chi tiết sản phẩm: <span th:text="${product.moTaSP}"></span></li>
                                </ul>
                            </div>
                            <a href="/admin/product" type="button" class="btn btn-success mt-3">
                                Back
                            </a>
                        </div>
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
      
    
</body>
</html>
