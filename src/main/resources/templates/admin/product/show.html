<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Show Product</title>
        <link rel="stylesheet" th:href="@{/content/css/style.css}">
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <div th:insert="~{fragments/header :: navigation}"></div>

        <div id="layoutSidenav">
            <div th:insert="~{fragments/sidebar :: sidebar}"></div>
            <div id="layoutSidenav_content">
                 <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Prodcut</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item active">Products</li>
                    </ol>
                        <div class="d-flex">
                            <div class="p2 me-auto">
                                <h2>Table Product</h2>
                            </div>
                            <a href="/admin/product/create" type="button" class="btn btn-primary ml-auto">
                                Create a product
                            </a>
                        </div>
                        <hr>
                        <div class="col-lg-12 col-md-6">
                            <table class="table table-bordered table-hover">
                                <thead>
                                  <tr>
                                    <th scope="col">Product Id</th>
                                    <!-- <th scope="col">Image Url</th> -->
                                    <th scope="col">Detail Product</th>
                                    <th scope="col">Sl_Ton Kho</th>
                                    <th scope="col">Name Product</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Supplier</th>
                                    <!-- <th scope="col" class="d-none d-xxl-table-cell">Category_ID</th>
                                    <th scope="col" class="d-none d-xxl-table-cell">Supplier_ID</th> -->
                                    <th scope="col">Action</th>
                                    
                                  </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product: ${products}">
                                        <th scope="row" th:text="${product.productId}">1</th>
                                        <td><span th:text="${product.moTaSP}">Detail Product </span></td>
                                        <td><span th:text="${product.slTonKho}">Sl_Ton Kho</span></td>
                                        <td><span th:text="${product.tenSP}">Name Product</span></td>
                                        <td><span th:text="${product.category.categoryName}">Category</span></td> 
                                        <td><span th:text="${product.supplier.tenSup}">Supplier</span></td> 
                                        <td>
                                            <div class="d-flex">
                                                <a th:href="@{/admin/product/{productId}(productId = ${product.productId})}" type="button" class="btn btn-success">View</a>
                                            <a th:href="@{/admin/product/update/{productId}(productId = ${product.productId})}" type="button" class="btn btn-warning">Update</a>
                                            <a th:href="@{/admin/product/delete/{productId}(productId = ${product.productId})}" type="button" class="btn btn-danger">Delete</a>
                                            </div>
                                        </td>
                                    </tr>
                                  </tr>
                                </tbody>
                              </table>
                        
                        </div>
                        
                </div>
            </main>
                <div th:insert="~{fragments/footer :: footer}"></div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/content/js/scripts.js}"></script>
    </body>
</html>
