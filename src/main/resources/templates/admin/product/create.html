<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Product Page</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $(document).ready(() => {
            const avatarFile = $("#avatarFile");
            avatarFile.change(function (e) {
    const file = e.target.files[0];
    if (file && (file.type === "image/png" || file.type === "image/jpeg" || file.type === "image/jpg")) {
        const imgURL = URL.createObjectURL(file);
        $("#avatarPreview").attr("src", imgURL).css({ "display": "block" });
    } else {
        alert("Vui lòng chọn file ảnh có định dạng .png, .jpg, hoặc .jpeg!");
        $("#avatarPreview").css({ "display": "none" }).attr("src", "");
    }
});
        });
    </script>

    <!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" th:href="@{/content/css/style.css}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <div th:insert="~{fragments/header :: navigation}"></div>
    <div id="layoutSidenav">
        <div th:insert="~{fragments/sidebar :: sidebar}"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Manage Product</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="/admin">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/admin/product">Products</a></li>
                        <li class="breadcrumb-item active">Create</li>
                    </ol>
                        <hr>
                        <div class="container mt-5">
                            <div class="row">
                                <div class="col-md-6 col-12 mx-auto">
                                    <h3>Create a product</h3>
                                    <hr>
                                    <form th:action="@{/admin/product/create}" th:object="${product}" method="POST" class="row" enctype="multipart/form-data">
                                        <!--Tên sản phẩm-->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="tenSP" class="form-label required-label">Name Product<span>*</span></label>
                                            <input type="text" id="tenSP" class="form-control" th:field="*{tenSP}"
                                            th:classappend="${#fields.hasErrors('tenSP')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('tenSP')}" class="invalid-feedback" th:errors="*{tenSP}"></div>
                                        </div>
                                        <!--Giá Sản Phẩm-->
                                        <div class="mb-3 col-12 col-md-6">
                                          <label for="gia" class="form-label required-label">Giá<span>*</span></label>
                                          <input type="text" id="gia" class="form-control" th:field="*{gia}"
                                          th:classappend="${#fields.hasErrors('gia')} ? 'is-invalid' : ''">
                                          <div th:if="${#fields.hasErrors('gia')}" class="invalid-feedback" th:errors="*{gia}"></div>
                                        </div>
                                        <!--Chi tiết sản phẩm-->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="moTaSP" class="form-label required-label">Detail Product<span>*</span></label>
                                            <input type="text" id="moTaSP" class="form-control" th:field="*{moTaSP}"
                                            th:classappend="${#fields.hasErrors('moTaSP')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('moTaSP')}" class="invalid-feedback" th:errors="*{moTaSP}"></div>
                                        </div>
                                        <!--Mô tả ngắn-->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="moTaNganSP" class="form-label required-label">Short Detail Product<span>*</span></label>
                                            <input type="text" id="moTaNganSP" class="form-control" th:field="*{moTaNganSP}"
                                            th:classappend="${#fields.hasErrors('moTaNganSP')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('moTaNganSP')}" class="invalid-feedback" th:errors="*{moTaNganSP}"></div>
                                        </div>
                                        <!--Mã định danh-->
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="sku" class="form-label required-label">SKU<span>*</span></label>
                                            <input type="text" id="sku" class="form-control" th:field="*{sku}"
                                            th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid' : ''">
                                            <div th:if="${#fields.hasErrors('sku')}" class="invalid-feedback" th:errors="*{sku}"></div>
                                            <div th:if="${error}" class="alert alert-danger">
                                                <strong>Lỗi:</strong> <span th:text="${error}"></span>
                                            </div>
                                        </div>
                                        <div class="mb-3 col-12 col-md-6">
                                          <label for="slTonKho" class="form-label">Sl_Ton Kho</label>
                                          <input type="text" id="slTonKho" class="form-control" th:field="*{slTonKho}">
                                        </div>
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="category" class="form-label">Category: </label><br>
                                            <select th:field="*{category.categoryId}" class="col-12 form-select">
                                                <option th:each="category :${categories}"
                                                        th:value="${category.categoryId}" 
                                                        th:text="${category.categoryName}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="supplier" class="form-label">Supplier: </label><br>
                                            <select th:field="*{supplier.supplierId}" class="col-12 form-select">
                                                <option th:each="supplier :${suppliers}"
                                                th:value="${supplier.supplierId}" th:text="${supplier.tenSup}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3 col-12 col-md-6">
                                            <label for="thue" class="form-label">Thuế</label>
                                            <input type="text" id="thue" class="form-control" th:field="*{thue}">
                                          </div>
                                          <div class="mb-3 col-12 col-md-6">
                                            <label for="avatarFile" class="form-label">Upload File Product</label><br>
                                            <input type="file" class="form-control-file" id="avatarFile" name="image"
                                                accept=".png, .jpg, .jpeg">
                                        </div>
                                        <div class="col-12 mb-3">
                                            <img alt="avatarPreview" style="max-height: 250px; display: none;" id="avatarPreview">
                                        </div>   
                                                
                                        <div class="col-12 mb-5">
                                            <button type="submit" class="btn btn-primary mt-3">Create</button>
                                            <a href="/admin/product" type="button" class="btn btn-success mt-3">
                                                Back
                                            </a>
                                        </div>
                                        
                                        
                                      </form>
                                </div>
                            </div>
                            
                        </div>
                </div>
            </main>
            <div th:insert="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/content/js/scripts.js}"></script>
    <script>
        (function () {
          'use strict'
        
          var forms = document.querySelectorAll('.needs-validation')
        
          Array.prototype.slice.call(forms)
            .forEach(function (form) {
              form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                  event.preventDefault()
                  event.stopPropagation()
                }
        
                form.classList.add('was-validated')
              }, false)
            })
        })()
        </script>
    
</body>
</html>
